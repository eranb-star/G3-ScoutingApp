name: CI

on:
  pull_request:
    branches: [ "dev", "main", "web-portal-preview", "codex/**" ]
  push:
    branches: [ "dev", "main", "web-portal-preview", "codex/**" ]

jobs:
   dashboard_web:
    name: Dashboard (Web) - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build
      - name: Install isolated SQL test engine
        run: npm install --prefix "$RUNNER_TEMP/g3-sql" --no-save @electric-sql/pglite@0.5.8
      - name: Local-only engineering and lifecycle acceptance
        env:
          PGLITE_MODULE: ${{ runner.temp }}/g3-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node scripts/test-project-action-consistency.mjs
          node scripts/test-engineering-records.mjs
          node scripts/test-project-archive.mjs
          node scripts/test-review-queue.mjs
          node scripts/test-review-draft.mjs
          node scripts/test-fundraising.mjs
          node scripts/test-operational-clarity.mjs
          node scripts/test-robot-build-jobs.mjs
          node scripts/test-robot-build-bom-storage.mjs
          node scripts/test-robot-build-stock.mjs
          node scripts/test-robot-build-integration.mjs
          node scripts/test-robot-build-manual.mjs
          node scripts/test-robot-build-reconciliation.mjs
          node scripts/test-robot-build-manufacturing.mjs
          node scripts/test-robot-build-installation.mjs
          node scripts/test-robot-build-operations.mjs
          node scripts/test-robot-build-purchase-reuse.mjs
          node scripts/test-robot-build-workspace.mjs
          node scripts/test-build-revision-comparison.mjs
          node scripts/test-robot-build-maintenance.mjs
          node scripts/test-workshop-resources.mjs
          node scripts/test-robot-build-pack-purchasing.mjs
          node scripts/test-robot-build-adoption.mjs
          node scripts/test-robot-build-stock-assembly.mjs
          node scripts/test-robot-build-release-rehearsal.mjs
          node scripts/test-build-freshness.mjs
          node scripts/test-build-source-observations.mjs
          node scripts/test-build-subsystems.mjs
          node scripts/test-build-wip-adoption.mjs
          node scripts/test-build-readiness-holds.mjs
          node scripts/test-build-material-specs.mjs
          node scripts/test-robot-build-scope.mjs
          node scripts/test-build-preparation.mjs
          node scripts/test-build-material-reservations.mjs
          node scripts/test-robot-build-lots.mjs
          node scripts/test-robot-build-files.mjs
          node scripts/test-robot-build-kit-requirements.mjs
          node scripts/test-robot-build-holds.mjs
          node scripts/test-build-file-handler.mjs
          node scripts/test-browser-attendance.mjs
          node scripts/verify-mobile-notification-stability.mjs
      # Exercise the current permission-controlled catalogue, not obsolete token/URL strings.
      - name: Private repository access boundaries
        run: node scripts/test-private-repositories.mjs
      - name: Private CAD authorization, revisions and review evidence
        env:
          PGLITE_MODULE: ${{ runner.temp }}/g3-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node scripts/test-onshape-security.mjs
          node scripts/test-onshape-handler.mjs
          node scripts/test-onshape-snapshot.mjs
          node scripts/test-onshape-storage.mjs
          node scripts/test-cad-review.mjs
          node scripts/test-robot-build-bom.mjs
          node scripts/test-cad-part-metadata.mjs
