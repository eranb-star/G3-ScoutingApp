name: CI

on:
  pull_request:
    branches: [ "dev", "main", "web-portal-preview", "codex/**" ]
  push:
    branches: [ "dev", "main", "web-portal-preview", "codex/**" ]

jobs:
   dashboard_web:
    name: Dashboard (Web) - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build
      - name: Install isolated SQL test engine
        run: npm install --prefix "$RUNNER_TEMP/g3-sql" --no-save @electric-sql/pglite@0.5.8
      - name: Local-only engineering and lifecycle acceptance
        env:
          PGLITE_MODULE: ${{ runner.temp }}/g3-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node scripts/test-project-action-consistency.mjs
          node scripts/test-engineering-records.mjs
          node scripts/test-project-archive.mjs
          node scripts/test-review-queue.mjs
          node scripts/test-review-draft.mjs
          node scripts/verify-mobile-notification-stability.mjs
