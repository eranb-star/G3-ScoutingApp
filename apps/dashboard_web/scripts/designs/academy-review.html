<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G3 Academy · Design review</title>
<style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#302438;background:#f7f5f8;--pink:#b40079;--line:#e7dfe9;--muted:#706778}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:inherit;border-radius:10px;padding:12px 18px;min-height:44px;font-weight:650}button:hover{border-color:var(--pink)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3e87bf;outline-offset:3px}button.primary,button[aria-current=page]{background:var(--pink);color:white;border-color:var(--pink)}button:disabled{opacity:.5;cursor:default}header{background:#29162a;color:white;padding:16px 4vw;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.brand{font-weight:850;font-size:22px;letter-spacing:.06em}.brand small{display:block;font-size:10px;letter-spacing:.13em;color:#e6b9d7}.review{font-size:12px;color:#e9c7dd;flex:1}header label{font-size:12px;display:grid;grid-template-rows:auto 44px;gap:8px;min-width:150px}header select{margin-inline-start:0;width:100%;height:44px;padding:8px;border-radius:8px;background:#fff;color:#302438}main{max-width:1280px;margin:auto;padding:30px 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:36px;letter-spacing:-.035em;margin:0 0 8px}h2{font-size:25px;letter-spacing:-.025em;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}p{line-height:1.6;color:var(--muted);margin:8px 0 18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--pink);margin-bottom:10px}nav{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:22px 0;margin-bottom:28px;flex-wrap:wrap}nav button{background:transparent;border-color:transparent}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:20px}.focus{border-top:5px solid var(--pink);background:linear-gradient(120deg,#fff 40%,#fff4fb)}.pill{display:inline-block;font-size:12px;padding:5px 10px;border-radius:20px;background:#f3e9f0;color:#8d1d69;margin-bottom:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.progress{height:6px;background:#eae3eb;border-radius:6px;margin:22px 0 10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pink);width:50%}.muted,small{color:var(--muted);font-size:13px}.list{display:grid;gap:0}.item{padding:20px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.steps button{flex:1;white-space:nowrap;font-size:13px}.notice{padding:14px 18px;background:#f1eef7;border-radius:10px;font-size:13px;line-height:1.6;margin:16px 0}.form{display:grid;gap:18px}label{display:grid;gap:8px;font-weight:600;font-size:14px}input,textarea,select{padding:12px;border:1px solid #d9ccde;border-radius:8px;max-width:100%;background:white;color:inherit}textarea{min-height:110px;resize:vertical}.choice{display:flex;align-items:center;gap:12px;font-weight:400;padding:13px;border:1px solid var(--line);border-radius:9px;margin:10px 0}.choice input{width:18px;height:18px;accent-color:var(--pink)}.metric{font-size:32px;font-weight:750;color:#392841}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px;margin-top:24px}#toast{position:fixed;bottom:20px;inset-inline:20px;margin:auto;max-width:600px;background:#302438;color:#fff;padding:16px 22px;border-radius:12px;z-index:10;display:none}.back{margin-bottom:20px}.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.course-grid .card{margin:0}.link{color:var(--pink);background:transparent;border:0;padding-inline:0}.frame-note{border-inline-start:3px solid var(--pink);padding-inline-start:14px}ol{padding-inline-start:22px;line-height:1.9}dialog{border:1px solid var(--line);border-radius:18px;padding:30px;max-width:600px;width:90%}dialog::backdrop{background:#24142b80}@media(max-width:760px){main{padding:24px 18px}.grid,.course-grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}h1{font-size:29px}header{gap:14px}.review{flex-basis:60%}.card{padding:20px}nav{padding:16px 0;gap:3px}nav button{padding:10px;font-size:13px}.steps{display:grid;grid-template-columns:1fr 1fr}.actions button{flex:1}header label{display:grid;align-items:stretch;flex:1;min-width:130px} }
</style>
<header><div class="brand">G3 / 6740<small>GLUED BY PASSION</small></div><span class="review" id="review"></span><label id="roleLabel"></label><label id="languageLabel"></label></header><main id="app"></main><div id="toast" role="status"></div><dialog id="modal"></dialog>
<script>
const query=new URLSearchParams(location.search);let lang=query.get('lang')==='he'?'he':'en',role=['mentor','leader'].includes(query.get('role'))?query.get('role'):'student',view=query.get('view')==='instructor'?'instructor':'home',step=0,builder=0,section='courses',course=1,submitted=false;const drafts={};
const tr=(en,he)=>lang==='he'?he:en;const titles=[['Power & component identification','חשמל וזיהוי רכיבים'],['CAN & sensors','תקשורת CAN וחיישנים'],['Wiring & mounting inspection','בדיקת חיווט והתקנה'],['Mechanical fastening','חיבורים מכניים'],['Shafts, bearings & transmission','צירים, מיסבים ותמסורת'],['Intake & shooter testing','בדיקות קליטה וירי']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(text,action,primary=false){return `<button ${primary?'class="primary"':''} onclick="${action}">${text}</button>`}function title(i){return tr(...titles[i])}function toast(en,he){const t=document.querySelector('#toast');t.textContent=tr(en,he);t.style.display='block';setTimeout(()=>t.style.display='none',4000)}function go(v){view=v;render();window.scrollTo(0,0)}function lesson(i){course=i;step=0;go('lesson')}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.querySelector('#review').textContent=tr('INTERACTIVE DESIGN REVIEW · Example data only','סקירת עיצוב אינטראקטיבית · נתונים לדוגמה בלבד');document.querySelector('#roleLabel').innerHTML=tr('Preview as','תצוגה בתפקיד')+`<select aria-label="${tr('Preview role','תפקיד לתצוגה')}" onchange="role=this.value;go('home')"><option value="student" ${role==='student'?'selected':''}>${tr('Student','תלמיד/ה')}</option><option value="mentor" ${role==='mentor'?'selected':''}>${tr('Mentor','מנטור/ית')}</option><option value="leader" ${role==='leader'?'selected':''}>${tr('Team leader','מוביל/ת תת־צוות')}</option></select>`;document.querySelector('#languageLabel').innerHTML=tr('Language','שפה')+`<select aria-label="${tr('Language','שפה')}" onchange="lang=this.value;render()"><option value="en" ${lang==='en'?'selected':''}>English</option><option value="he" ${lang==='he'?'selected':''}>עברית</option></select>`;
document.querySelector('#app').innerHTML=`<div class="top"><div><div class="eyebrow">${tr('SKILLS ACADEMY','אקדמיית מיומנויות')}</div><h1>${tr('Build skills. Build your team.','בונים מיומנויות. בונים קבוצה.')}</h1><p>${tr('Your next step, your feedback and your progress — in one place.','הצעד הבא, המשוב וההתקדמות שלך — במקום אחד.')}</p></div>${role!=='student'?btn(tr('Instructor workspace','מרחב מדריכים'),"go('instructor')"):''}</div><nav aria-label="${tr('Academy navigation','ניווט באקדמיה')}">${[['home',tr('My learning','הלמידה שלי')],['explore',tr('Explore','לגלות ולחקור')],['progress',tr('My progress','ההתקדמות שלי')]].map(([v,l])=>`<button aria-current="${view===v?'page':'false'}" onclick="go('${v}')">${l}</button>`).join('')}</nav>${content()}<footer>${tr('Design prototype · No real enrollments, grades or robot records are changed. Role switching is for review only.','אב־טיפוס לעיצוב · אין שינוי בהקצאות, ציונים או בדיקות אמיתיות. החלפת תפקיד מיועדת לסקירה בלבד.')}</footer>`}
function content(){if(view==='home')return `<div class="grid"><section><div class="card focus"><span class="pill">${tr('YOUR NEXT STEP','הצעד הבא שלך')}</span><h2>${title(1)}</h2><p>${tr('You completed the lesson. Check your understanding, then demonstrate the inspection on the robot.','השלמת את השיעור. עכשיו בדיקת הבנה, ולאחריה הדגמת הבדיקה על הרובוט.')}</p><div class="progress"><i></i></div><div class="row"><small>${tr('Lesson completed · Quiz next','השיעור הושלם · המבחן הוא השלב הבא')}</small><small>${tr('Assigned to: Electronics','הוקצה לצוות: אלקטרוניקה')}</small></div><div class="actions">${btn(tr('Continue learning →','המשך למידה ←'),"course=1;step=1;go('lesson')",true)}</div></div><h3>${tr('Also assigned to you','הוקצה לך גם')}</h3><div class="card list">${[0,3].map(i=>`<div class="item row"><div><h3>${title(i)}</h3><small>${tr('Not started · Lesson + quiz + 2 demonstrations','טרם התחלת · שיעור, מבחן ושתי הדגמות')}</small></div>${btn(tr('Start','התחלה'),`lesson(${i})`)}</div>`).join('')}</div></section><aside><div class="card"><span class="pill">${tr('ACTION NEEDED','נדרשת פעולה')}</span><h3>${tr('Improve your wiring evidence','שיפור תיעוד החיווט')}</h3><p>${tr('Reviewer: show the strain relief and explain how the connector is secured.','משוב הבודק: הציגו את קיבוע הכבל והסבירו איך המחבר מאובטח.')}</p>${btn(tr('Read feedback','קריאת המשוב'),"course=2;step=3;go('lesson')")}</div><div class="card"><h3>${tr('Your skill journey','ההתקדמות שלך')}</h3><div class="metric">1 / 6</div><p>${tr('Example completed modules. A quiz alone does not qualify a practical skill.','יחידות שהושלמו בדוגמה. מבחן לבדו אינו הסמכה מעשית.')}</p>${btn(tr('View progress','צפייה בהתקדמות'),"go('progress')")}</div></aside></div>`;
if(view==='lesson')return `${btn(tr('← My learning','→ הלמידה שלי'),"go('home')")}<div class="row" style="margin-top:24px"><div><span class="pill">${tr('ASSIGNED COURSE','קורס שהוקצה')}</span><h2>${title(course)}</h2></div>${btn(tr('Save draft','שמירת טיוטה'),"toast('Draft kept for this review session.','הטיוטה נשמרה לסקירה הנוכחית.')")}</div><div class="steps">${[tr('Learn','ללמוד'),tr('Check understanding','בדיקת הבנה'),tr('Demonstrate','להדגים'),tr('Feedback','משוב')].map((l,i)=>`<button aria-current="${step===i?'page':'false'}" onclick="step=${i};render()">${i+1} · ${l}</button>`).join('')}</div><div class="grid"><article class="card">${step===0?`<h2>${tr('Inspect before you connect','בודקים לפני שמחברים')}</h2><p>${tr('Follow the source for the installed hardware. Practice on an unpowered assembly with a responsible reviewer.','פעלו לפי המקור המתאים לחומרה המותקנת. תרגלו על מכלול מנותק מחשמל עם בודק אחראי.')}</p><ol><li>${tr('Identify each component and its purpose.','זהו כל רכיב ואת תפקידו.')}</li><li>${tr('Trace the connections and record anything uncertain.','עקבו אחר החיבורים ותעדו כל דבר שאינו ברור.')}</li><li>${tr('Compare your findings with the published reference.','השוו את הממצאים למקור שפורסם.')}</li></ol>${btn(tr('Open reference robot','פתיחת רובוט לדוגמה'),"openLab()")}`:step===1?`<span class="pill">${tr('EXAMPLE QUESTION · 1 OF 10','שאלה לדוגמה · 1 מתוך 10')}</span><h2>${tr('What should happen before changing robot wiring?','מה צריך לעשות לפני שינוי חיווט ברובוט?')}</h2>${[tr('Disconnect power and follow the supervised inspection procedure.','לנתק חשמל ולפעול לפי נוהל בדיקה בפיקוח.'),tr('Only check whether a status LED is off.','לבדוק רק שנורית החיווי כבויה.')].map((l,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${drafts.answer===String(i)?'checked':''} onchange="drafts.answer=this.value">${l}</label>`).join('')}${btn(tr('Check answer','בדיקת תשובה'),"checkAnswer()",true)}`:step===2?`<h2>${tr('Demonstrate on the real assembly','הדגמה על המכלול האמיתי')}</h2><p>${tr('Record what you inspected, what you found and what needs correction. Reference CAD is not proof of installed wiring.','תעדו מה בדקתם, מה מצאתם ומה דורש תיקון. מודל CAD אינו ראיה לחיווט המותקן.')}</p><label>${tr('Your observations','הממצאים שלך')}<textarea oninput="drafts.observation=this.value">${esc(drafts.observation)}</textarea></label><div class="actions">${btn(tr('Inspect reference CAD','בדיקת CAD לדוגמה'),"openLab()")}${btn(tr('Attach robot test','צירוף בדיקת רובוט'),"openTest()")}</div><div class="actions">${btn(submitted?tr('Submitted in prototype','נשלח באב־הטיפוס'):tr('Submit for review','שליחה לבדיקה'),"submitted=true;step=3;render()",true)}</div>`:`<span class="pill">${submitted?tr('AWAITING REVIEW','ממתין לבדיקה'):tr('CHANGES REQUESTED','נדרש תיקון')}</span><h2>${submitted?tr('Your reviewer takes it from here','מכאן הבודק ממשיך'):tr('Make the evidence clear','מציגים ראיות ברורות')}</h2><p>${submitted?tr('Prototype submission only. In the app, a permitted reviewer checks each criterion before approval.','שליחה לדוגמה בלבד. באפליקציה בודק מורשה מאמת כל קריטריון לפני אישור.'):tr('Show the cable strain relief and explain how the connector is secured. Your previous attempt stays in the history.','הציגו את קיבוע הכבל והסבירו איך המחבר מאובטח. הניסיון הקודם נשמר בהיסטוריה.')}</p>${btn(tr('Return to demonstration','חזרה להדגמה'),"step=2;render()")}`}</article><aside class="card"><h3>${tr('What completion requires','מה נדרש להשלמה')}</h3><p>${tr('Pass the quiz and receive approval for both practical demonstrations.','לעבור את המבחן ולקבל אישור לשתי ההדגמות המעשיות.')}</p><div class="frame-note">${tr('You stay in this course when opening references or attaching test evidence.','פתיחת מקורות וצירוף בדיקות שומרים על ההקשר של הקורס.')}</div><div class="actions">${step<3?btn(tr('Next step →','לשלב הבא ←'),"step++;render()"):''}</div></aside></div>`;
if(view==='explore')return `<h2>${tr('Explore without an assignment','לחקור גם בלי מטלה')}</h2><p>${tr('Reference tools support your learning. They do not create new required work.','כלי העזר תומכים בלמידה ואינם יוצרים מטלות חובה חדשות.')}</p><div class="course-grid"><div class="card"><span class="pill">${tr('REFERENCE','מקורות')}</span><h2>${tr('Learning library','ספריית למידה')}</h2><p>${tr('Find official guides and team examples by topic.','מדריכים רשמיים ודוגמאות מקבוצות לפי נושא.')}</p>${btn(tr('Browse topics','עיון בנושאים'),"openLibrary()")}</div><div class="card"><span class="pill">3D</span><h2>${tr('Robot learning lab','מעבדת רובוטים')}</h2><p>${tr('Inspect the existing published robot CAD and subsystems.','בדיקת מודלי הרובוטים שפורסמו ותתי־המערכות שלהם.')}</p>${btn(tr('Explore robot models','חקירת מודלי רובוט'),"openLab()")}</div></div>`;
if(view==='progress')return `<h2>${tr('Skills you can demonstrate','מיומנויות שניתן להדגים')}</h2><p>${tr('Knowledge checks and practical approval are shown separately. Example records.','בדיקות ידע ואישורים מעשיים מוצגים בנפרד. רשומות לדוגמה.')}</p><div class="card list">${titles.map((t,i)=>`<div class="item row"><div><h3>${tr(...t)}</h3><small>${i===5?tr('Quiz passed · Both demonstrations approved','המבחן עבר · שתי ההדגמות אושרו'):i===2?tr('Feedback needs your attention','ממתין לתיקון בעקבות משוב'):tr('Practical approval outstanding','האישור המעשי טרם הושלם')}</small></div>${btn(tr('View course','צפייה בקורס'),`lesson(${i})`)}</div>`).join('')}</div>`;
if(view==='instructor')return `<div class="row"><div><div class="eyebrow">${tr('INSTRUCTOR WORKSPACE','מרחב מדריכים')}</div><h2>${tr('Help the team move forward','עוזרים לקבוצה להתקדם')}</h2><p>${role==='leader'?tr('Scope: your authorized subteam. Review permission is separate.','תחום אחריות: תת־הצוות המורשה שלך. הרשאת בדיקה נפרדת.'):tr('Assign focused learning. Review practical evidence. Spot who needs help.','מקצים למידה ממוקדת. בודקים ראיות מעשיות. מזהים מי צריך עזרה.')}</p></div>${btn(tr('+ Create course','+ יצירת קורס'),"builder=0;go('builder')",true)}</div><div class="steps">${[['courses',tr('Courses & assignments','קורסים והקצאות')],['reviews',tr('Review submissions · 2','בדיקת הגשות · 2')],['team',tr('Team progress','התקדמות הקבוצה')]].map(([v,l])=>`<button aria-current="${section===v?'page':'false'}" onclick="section='${v}';render()">${l}</button>`).join('')}</div>${section==='courses'?`<div class="card list">${titles.map((t,i)=>`<div class="item row"><div><h3>${tr(...t)}</h3><small>${tr('Published · Prepared G3 module','פורסם · יחידה מוכנה של G3')}</small></div><div class="actions">${btn(tr('Preview','תצוגה מקדימה'),`lesson(${i})`)}${btn(tr('Assign','הקצאה'),"openAssign()")}</div></div>`).join('')}</div>`:section==='reviews'?`<p>${tr('All pending submissions within your permitted scope. Counts are not limited to a hidden selected course.','כל ההגשות הממתינות בתחום ההרשאה שלך. הספירה אינה מוגבלת לקורס נבחר נסתר.')}</p><div class="card"><span class="pill">${tr('EXAMPLE SUBMISSION','הגשה לדוגמה')}</span><h3>${title(1)} · ${tr('Connector inspection','בדיקת מחבר')}</h3><p>${tr('Student A · Submitted for practical review','תלמיד/ה א׳ · הוגש לבדיקה מעשית')}</p>${btn(tr('Open evidence & rubric','פתיחת ראיות וקריטריונים'),"openReview()",true)}</div>`:`<div class="card"><h3>${tr('Focus on students needing support','התמקדות בתלמידים שצריכים תמיכה')}</h3><p>${tr('2 waiting for review · 1 needs correction · 3 not started. Example data.','2 ממתינים לבדיקה · 1 צריך תיקון · 3 טרם התחילו. נתונים לדוגמה.')}</p>${btn(tr('Open pending reviews','פתיחת הגשות ממתינות'),"section='reviews';render()")}</div>`}`;
return `${btn(tr('← Instructor workspace','→ מרחב מדריכים'),"go('instructor')")}<h2 style="margin-top:24px">${tr('Create a focused course','יצירת קורס ממוקד')}</h2><div class="steps">${[tr('Course details','פרטי קורס'),tr('Lessons & assessments','שיעורים ומטלות'),tr('Student preview','תצוגת תלמיד'),tr('Publish & assign','פרסום והקצאה')].map((l,i)=>`<button aria-current="${builder===i?'page':'false'}" onclick="builder=${i};render()">${i+1} · ${l}</button>`).join('')}</div><div class="card">${builder===0?`<div class="form"><label>${tr('Course title','שם הקורס')}<input value="${esc(drafts.name)}" placeholder="${tr('e.g. Reliable CAN connections','לדוגמה: חיבורי CAN אמינים')}" oninput="drafts.name=this.value"></label><label>${tr('Learning outcome','מטרת הלמידה')}<textarea oninput="drafts.goal=this.value">${esc(drafts.goal)}</textarea></label><p>${tr('Author each language separately. Missing translations must be labeled, never concatenated into one paragraph.','כותבים כל שפה בנפרד. תרגום חסר יסומן בבירור ולא יחובר לפסקה בשפה אחרת.')}</p></div>`:builder===1?`<h3>${tr('A clear lesson, then proof','שיעור ברור, ואז הוכחת הבנה')}</h3><label>${tr('Lesson instructions','הוראות השיעור')}<textarea oninput="drafts.lesson=this.value">${esc(drafts.lesson)}</textarea></label><div class="notice">${tr('Attach existing library/CAD references. Add a quiz and practical rubric. Keep review permission separate from course authoring.','צרפו מקורות מהספרייה או CAD קיימים. הוסיפו מבחן וקריטריונים מעשיים. הרשאת בדיקה נפרדת מהרשאת יצירת קורס.')}</div>`:builder===2?`<span class="pill">${tr('STUDENT PREVIEW','תצוגת תלמיד')}</span><h2>${esc(drafts.name)||tr('Your new course','הקורס החדש שלך')}</h2><p>${esc(drafts.goal)||tr('Your learning outcome appears here.','מטרת הלמידה תופיע כאן.')}</p><p>${esc(drafts.lesson)||tr('Your lesson instructions appear here.','הוראות השיעור יופיעו כאן.')}</p>`:`<h3>${tr('Publishing does not assign it to everyone','פרסום אינו מקצה את הקורס לכולם')}</h3><p>${tr('Publish to make the course available. Then choose who should complete it and an optional deadline.','מפרסמים כדי להפוך את הקורס לזמין. אחר כך בוחרים למי להקצות אותו ומועד הגשה אופציונלי.')}</p><div class="actions">${btn(tr('Publish only','פרסום בלבד'),"toast('Published in the prototype only. No members assigned.','פורסם באב־הטיפוס בלבד. לא הוקצה לחברים.')")}${btn(tr('Publish & choose learners','פרסום ובחירת לומדים'),"openAssign()",true)}</div>`}<div class="actions">${builder<3?btn(tr('Continue →','המשך ←'),"builder++;render()",true):''}</div></div>`}
function modal(body){const d=document.querySelector('#modal');d.innerHTML=body+`<div class="actions">${btn(tr('Return','חזרה'),"document.querySelector('#modal').close()")}</div>`;d.showModal()}
function checkAnswer(){toast(drafts.answer==='0'?'Correct. Continue to the practical demonstration.':drafts.answer?'Review the power-isolation instruction and try again.':'Choose an answer first.',drafts.answer==='0'?'נכון. אפשר להמשיך להדגמה המעשית.':drafts.answer?'חזרו להוראות ניתוק החשמל ונסו שוב.':'בחרו תשובה תחילה.')}
function openLab(){modal(`<span class="pill">${tr('REFERENCE TOOL','כלי עזר')}</span><h2>${tr('Inspect without losing your place','בודקים בלי לאבד את ההקשר')}</h2><p>${tr('The existing real CAD viewer would open here, keeping the current course and draft. This prototype does not replace it with a fake robot.','כאן ייפתח מציג ה־CAD האמיתי הקיים, תוך שמירת הקורס והטיוטה. אב־הטיפוס אינו מחליף אותו ברובוט מדומה.')}</p><p>${tr('Choose robot → subsystem → inspect → record observation → return to assignment.','בחירת רובוט ← תת־מערכת ← בדיקה ← תיעוד ממצא ← חזרה למטלה.')}</p>`)}
function openTest(){modal(`<h2>${tr('Attach measured evidence','צירוף ראיה מדידה')}</h2><p>${tr('Select an existing shared test or open Robot reliability to record one. Keep physical and simulated evidence labeled separately.','בחרו בדיקה משותפת קיימת או פתחו את אזור אמינות הרובוט לתיעוד בדיקה. ראיות פיזיות וסימולציה יסומנו בנפרד.')}</p>${btn(tr('Attach example test','צירוף בדיקה לדוגמה'),"drafts.observation=(drafts.observation||'')+' '+tr('Example test attached (prototype).','צורפה בדיקה לדוגמה (אב־טיפוס).');document.querySelector('#modal').close();render()")}`)}
function openLibrary(){modal(`<h2>${tr('Explore by topic','חקירה לפי נושא')}</h2><div class="list">${titles.map((t,i)=>btn(tr(...t),`document.querySelector('#modal').close();lesson(${i})`)).join('')}</div>`)}
function openAssign(){modal(`<h2>${tr('Choose who should learn this','למי להקצות את הלמידה?')}</h2><div class="form"><label>${tr('Audience','קהל יעד')}<select><option>${tr('Select students','בחירת תלמידים')}</option><option>${tr('My authorized subteam','תת־הצוות המורשה שלי')}</option>${role==='mentor'?`<option>${tr('Whole team, if permitted','כל הקבוצה, בהתאם להרשאה')}</option>`:''}</select></label><label>${tr('Deadline (optional)','מועד הגשה (אופציונלי)')}<input type="date"></label></div><div class="notice">${tr('Example only. Production assignment requires selecting actual members and confirming the recipient count.','דוגמה בלבד. הקצאה אמיתית דורשת בחירת חברים ואישור מספר הנמענים.')}</div>${btn(tr('Confirm example assignment','אישור הקצאה לדוגמה'),"document.querySelector('#modal').close();toast('Example assignment confirmed. No production changes.','הקצאה לדוגמה אושרה. אין שינוי בייצור.')",true)}`)}
function openReview(){modal(`<h2>${tr('Evidence and rubric together','הראיות והקריטריונים יחד')}</h2><p>${tr('Example observation: connector and cable inspected with the assembly unpowered.','תצפית לדוגמה: המחבר והכבל נבדקו כשהמכלול מנותק מחשמל.')}</p>${[tr('Correct identification','זיהוי נכון'),tr('Safe inspection demonstrated','הודגמה בדיקה בטוחה'),tr('Clear evidence','ראיה ברורה'),tr('Learner explains the finding','התלמיד מסביר את הממצא')].map(t=>`<label class="choice"><input type="checkbox">${t}</label>`).join('')}<label>${tr('Specific feedback','משוב ממוקד')}<textarea></textarea></label>${btn(tr('Request correction','בקשת תיקון'),"document.querySelector('#modal').close();toast('Example feedback saved.','המשוב לדוגמה נשמר.')")}`)}
render();
</script></html>
