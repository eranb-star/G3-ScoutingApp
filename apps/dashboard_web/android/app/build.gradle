apply plugin: 'com.android.application'

// Spark-compatible native telemetry. Disable in a release with -Pg3TelemetryEnabled=false.
def g3TelemetryEnabled = providers.gradleProperty('g3TelemetryEnabled').getOrElse('true') == 'true'
def hasFirebaseConfiguration = file('google-services.json').exists()
if (hasFirebaseConfiguration) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
    apply plugin: 'com.google.firebase.firebase-perf'
} else {
    logger.warn('google-services.json not found; Firebase push and telemetry are unavailable.')
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    buildFeatures {
        buildConfig true
    }
    namespace = "com.g3.scouting"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.g3.scouting"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "2.1.8"
        buildConfigField 'boolean', 'CRASHLYTICS_TEST_BUILD', 'false'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
}

        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [g3TelemetryCollectionEnabled: 'false']
        }
        release {
            manifestPlaceholders = [g3TelemetryCollectionEnabled: (g3TelemetryEnabled && hasFirebaseConfiguration).toString()]
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Explicit QA variant: the normal release has no test-crash control.
        telemetryQa {
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix '-crash-test'
            buildConfigField 'boolean', 'CRASHLYTICS_TEST_BUILD', 'true'
            manifestPlaceholders = [g3TelemetryCollectionEnabled: hasFirebaseConfiguration.toString()]
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-perf'
}

apply from: 'capacitor.build.gradle'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
            }
        }

        tasks.withType(JavaCompile).configureEach {
            // this guarantees javac won't try to use 21
            options.release.set(21)
        }
    }
}
